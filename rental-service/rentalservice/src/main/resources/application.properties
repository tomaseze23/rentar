spring.application.name=rentalservice


grpc.server.port=9093

# Base de datos propia de este servicio
spring.datasource.url=jdbc:postgresql://localhost:5432/rentar_alquileres
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.main.web-application-type=none
grpc.server.reflection-service-enabled=true