# Levanta la infraestructura de Rentar (Hito 2).
#   docker compose up --build
# Para recrear las bases desde cero: docker compose down -v

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/scripts:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # Recién está listo cuando terminaron los scripts y existe rentar_clientes
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "rentar_clientes"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-rentar.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl list_queues -q name | grep -q rental-service.mantenimiento.resultado"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rentar_clientes
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy

  vehicle-service:
    build:
      context: .
      dockerfile: vehicle-service/Dockerfile
    environment:
      GRPC_PORT: 9091
      DB_URL: jdbc:postgresql://postgres:5432/rentar_vehiculos
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rental-service:
    build:
      context: .
      dockerfile: rental-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rentar_alquileres
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "9093:9093"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  registro-policial:
    build:
      context: .
      dockerfile: registro-policial/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  registro-titularidad:
    build:
      context: .
      dockerfile: registro-titularidad/Dockerfile
    environment:
      CLIENTE_ADDR: customer-service:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      customer-service:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      CLIENTE_ADDR: customer-service:9092
      VEHICULO_ADDR: ${VEHICULO_ADDR:-vehicle-service:9091}
      ALQUILER_ADDR: ${ALQUILER_ADDR:-rental-service:9093}
      JWT_SECRET: ${JWT_SECRET:-secreto-solo-para-desarrollo-no-usar-en-produccion-123456}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      - customer-service
      - vehicle-service
      - rental-service
volumes:
  postgres-data: