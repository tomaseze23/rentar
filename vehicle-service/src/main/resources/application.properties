spring.application.name=vehicle-service

# Puerto del servidor gRPC (el Gateway le va a apuntar a este puerto)
grpc.server.port=9091

# Base de datos propia de este servicio
spring.datasource.url=jdbc:postgresql://localhost:5432/vehicle_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.web-application-type=none
grpc.server.reflection-service-enabled=true