syntax = "proto3";

package rentar.vehiculo;

option java_multiple_files = true;
option java_package = "com.rentar.vehicleservice.grpc";
option java_outer_classname = "VehiculoProto";

// Servicio de Vehículos (Hito 2 - gRPC)
// Expone las operaciones que el API Gateway y el Rental Service necesitan
// para consultar y validar vehículos.
service VehiculoService {

  // ABM
  rpc CrearVehiculo (CrearVehiculoRequest) returns (VehiculoResponse);
  rpc ModificarVehiculo (ModificarVehiculoRequest) returns (VehiculoResponse);
  rpc BajaVehiculo (BajaVehiculoRequest) returns (BajaVehiculoResponse);

  // Consultas
  rpc ListarVehiculos (ListarVehiculosRequest) returns (ListarVehiculosResponse);
  rpc ConsultarVehiculo (ConsultarVehiculoRequest) returns (VehiculoResponse);

  // Usado por el Gateway para la pantalla de disponibilidad (filtra por tipo,
  // marca, modelo, precio y verifica que no tenga reservas en el rango)
  rpc ConsultarDisponibilidad (ConsultarDisponibilidadRequest) returns (ListarVehiculosResponse);

  // Usado por el Rental Service al crear/cancelar una reserva, para
  // verificar que el vehículo exista, esté activo, y para cambiar su estado
  rpc ValidarVehiculo (ValidarVehiculoRequest) returns (ValidarVehiculoResponse);
  rpc ActualizarEstado (ActualizarEstadoRequest) returns (VehiculoResponse);
}

enum TipoVehiculo {
  TIPO_VEHICULO_UNSPECIFIED = 0;
  SEDAN = 1;
  SUV = 2;
  PICKUP = 3;
  COUPE = 4;
  HATCHBACK = 5;
}

enum EstadoVehiculo {
  ESTADO_VEHICULO_UNSPECIFIED = 0;
  DISPONIBLE = 1;
  RESERVADO = 2;
  EN_ALQUILER = 3;
}

message Vehiculo {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  string anio = 5;
  string color = 6;
  TipoVehiculo tipoVehiculo = 7;
  double precioDiario = 8;
  EstadoVehiculo estado = 9;
  bool activo = 10;
}

message VehiculoResponse {
  Vehiculo vehiculo = 1;
}

message CrearVehiculoRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  string anio = 4;
  string color = 5;
  TipoVehiculo tipoVehiculo = 6;
  double precioDiario = 7;
}

message ModificarVehiculoRequest {
  int64 id = 1;
  string marca = 2;
  string modelo = 3;
  string anio = 4;
  string color = 5;
  TipoVehiculo tipoVehiculo = 6;
  double precioDiario = 7;
}

message BajaVehiculoRequest {
  int64 id = 1;
}

message BajaVehiculoResponse {
  bool exito = 1;
}

message ListarVehiculosRequest {
  optional bool activo = 1;
}

message ListarVehiculosResponse {
  repeated Vehiculo vehiculos = 1;
}

message ConsultarVehiculoRequest {
  int64 id = 1;
}

message ConsultarDisponibilidadRequest {
  optional TipoVehiculo tipoVehiculo = 1;
  optional string marca = 2;
  optional string modelo = 3;
  optional double precioMin = 4;
  optional double precioMax = 5;
  // fechas en formato ISO-8601 (ej: 2026-10-07T10:00:00)
  string fechaInicio = 6;
  string fechaFin = 7;
  // ids de vehículos que el Rental Service ya sabe que están ocupados
  // en ese rango (se excluyen del resultado)
  repeated int64 idsOcupados = 8;
}

message ValidarVehiculoRequest {
  int64 id = 1;
}

message ValidarVehiculoResponse {
  bool existe = 1;
  bool activo = 2;
  Vehiculo vehiculo = 3;
}

message ActualizarEstadoRequest {
  int64 id = 1;
  EstadoVehiculo nuevoEstado = 2;
}