syntax = "proto3";

package rental;

option java_multiple_files = true;
option java_package = "com.rentar.rentar.grpc.rental";
option java_outer_classname = "RentalProto";

// Servicio gRPC para Gestión de Reservas y Alquileres
service RentalService {
  rpc CrearReserva (CrearReservaRequest) returns (ReservaResponse);
  rpc CancelarReserva (CancelarReservaRequest) returns (ReservaResponse);
  rpc ObtenerReserva (ObtenerReservaRequest) returns (ReservaResponse);
  rpc ListarReservasPorCliente (ListarPorClienteRequest) returns (ListarReservasResponse);
  rpc ObtenerHistorial (HistorialRequest) returns (ListarReservasResponse);
}

// Estados coincidentes con tu Enum EstadoReserva
enum EstadoReservaProto {
  PENDIENTE = 0;
  CONFIRMADA = 1;
  CANCELADA = 2;
}

message CrearReservaRequest {
  int64 cliente_id = 1;
  int64 vehiculo_id = 2;
  string fecha_inicio = 3;  // Formato ISO-8601: "YYYY-MM-DDTHH:mm:ss"
  string fecha_fin = 4;
  double precio_diario = 5;
  double importe_total = 6;
}

message CancelarReservaRequest {
  int64 reserva_id = 1;
}

message ObtenerReservaRequest {
  int64 reserva_id = 1;
}

message ListarPorClienteRequest {
  int64 cliente_id = 1;
}

message HistorialRequest {
  int64 cliente_id = 1;
}

message ReservaResponse {
  int64 id = 1;
  int64 cliente_id = 2;
  int64 vehiculo_id = 3;
  string fecha_inicio = 4;
  string fecha_fin = 5;
  double precio_diario = 6;
  double importe_total = 7;
  EstadoReservaProto estado = 8;
  string mensaje = 9;
}

message ListarReservasResponse {
  repeated ReservaResponse reservas = 1;
}