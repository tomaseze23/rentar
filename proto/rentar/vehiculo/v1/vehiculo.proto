// =============================================================================
// Rentar - Servicio de Vehículos (Vehicle Service)
// =============================================================================
//
// Contrato gRPC del servicio responsable del dominio vehículos: la flota de
// Rentar y las solicitudes de incorporación de vehículos externos. Es el único
// dueño de la base rentar_vehiculos (tablas vehiculo y solicitud de
// incorporación): ni el API Gateway ni los demás servicios acceden a ella
// directamente.
//
// Convenciones:
//   - Cada RPC tiene su propio mensaje de solicitud y su propio mensaje de
//     respuesta (SolicitudXxx / RespuestaXxx). Las respuestas que devuelven un
//     vehículo lo traen en el campo "vehiculo".
//   - Los identificadores son int64 positivos.
//   - La baja de un vehículo es lógica (campo activo); nunca se borra de la base.
//   - Los campos optional ausentes significan "sin dato" o "sin filtro".
//   - Las verificaciones y validaciones de patente y titularidad son
//     asíncronas: se resuelven por eventos de RabbitMQ (ver eventos/README.md)
//     y estos RPC nunca esperan su resultado.
//
// Errores: se informan con los códigos de estado estándar de gRPC.
//   INVALID_ARGUMENT     datos obligatorios faltantes o con formato inválido
//   NOT_FOUND            el vehículo pedido no existe
//   ALREADY_EXISTS       la patente ya está registrada
//   FAILED_PRECONDITION  la operación no aplica al estado actual del vehículo
//                        (ej: reactivar un vehículo que ya está activo)
// =============================================================================

syntax = "proto3";

package rentar.vehiculo.v1;

option java_multiple_files = true;
option java_package = "com.rentar.proto.vehiculo";

import "rentar/comun/v1/comun.proto";

// Gestión y consulta de la flota de vehículos.
//
// Para validar la disponibilidad de un período el Gateway combina este servicio
// con el Rental Service: Rental informa qué vehículos están ocupados y este
// servicio filtra el resto.
service ServicioVehiculos {

  // Crea un vehículo nuevo. Queda en estado ESTADO_VEHICULO_DISPONIBLE y
  // activo.
  // Datos requeridos: patente (única), marca, modelo, anio (numérico, entre
  // 1900 y el año actual), tipo_vehiculo y precio_diario (mayor a 0).
  // Opcional: color.
  // Responde el vehículo creado con su id.
  // Errores: INVALID_ARGUMENT (campos obligatorios faltantes o año inválido),
  // ALREADY_EXISTS (patente duplicada).
  rpc CrearVehiculo(SolicitudCrearVehiculo) returns (RespuestaCrearVehiculo);

  // Modifica los datos de un vehículo existente. La patente no se puede
  // modificar y por eso no forma parte de la solicitud. Se reemplazan todos
  // los datos (como un PUT).
  // Datos requeridos: id, marca, modelo, anio, tipo_vehiculo y precio_diario.
  // Responde el vehículo actualizado.
  // Errores: NOT_FOUND (id inexistente), INVALID_ARGUMENT (campos
  // obligatorios faltantes o año inválido).
  rpc ActualizarVehiculo(SolicitudActualizarVehiculo)
      returns (RespuestaActualizarVehiculo);

  // Baja lógica: marca el vehículo como inactivo. No se elimina de la base ni
  // se pierden las reservas históricas. Un vehículo inactivo no se ofrece como
  // disponible.
  // Responde el vehículo ya dado de baja.
  // Errores: NOT_FOUND (id inexistente).
  rpc DarDeBajaVehiculo(SolicitudDarDeBajaVehiculo)
      returns (RespuestaDarDeBajaVehiculo);

  // Reactiva un vehículo dado de baja.
  // Responde el vehículo reactivado.
  // Errores: NOT_FOUND (id inexistente), FAILED_PRECONDITION (el vehículo ya
  // estaba activo).
  rpc ReactivarVehiculo(SolicitudReactivarVehiculo)
      returns (RespuestaReactivarVehiculo);

  // Lista vehículos. Permite filtrar opcionalmente por activo/inactivo, por
  // tipo de vehículo y/o por una lista puntual de ids; los filtros se
  // combinan. Sin filtros trae todos. Sin resultados responde una lista vacía.
  rpc ConsultarVehiculos(SolicitudConsultarVehiculos)
      returns (RespuestaConsultarVehiculos);

  // Consulta un vehículo por id, esté activo o dado de baja.
  // Errores: NOT_FOUND (id inexistente).
  rpc ConsultarVehiculo(SolicitudConsultarVehiculo)
      returns (RespuestaConsultarVehiculo);

  // Usado por el API Gateway para la pantalla de disponibilidad: filtra
  // vehículos activos por tipo, marca, modelo (búsqueda parcial) y rango de
  // precio, excluyendo los ids que ya están ocupados en el período consultado
  // (ese cálculo lo hace el Rental Service y el Gateway pasa el resultado acá).
  // Errores: INVALID_ARGUMENT (precio_min mayor a precio_max).
  rpc ConsultarDisponibilidad(SolicitudConsultarDisponibilidad)
      returns (RespuestaConsultarDisponibilidad);

  // Cambia el estado operativo de un vehículo (DISPONIBLE, RESERVADO,
  // EN_ALQUILER). Usado por el API Gateway, coordinando con el Rental Service,
  // al confirmar o finalizar una reserva.
  // Responde el vehículo con el estado nuevo.
  // Errores: NOT_FOUND (id inexistente), INVALID_ARGUMENT (estado inválido o
  // sin especificar).
  rpc ActualizarEstadoVehiculo(SolicitudActualizarEstadoVehiculo)
      returns (RespuestaActualizarEstadoVehiculo);

  // Un cliente propone incorporar un vehículo de su propiedad. La solicitud se
  // guarda en estado ESTADO_SOLICITUD_INCORPORACION_PENDIENTE y se responde
  // enseguida: las validaciones de patente y de titularidad se hacen de forma
  // asíncrona por eventos. El vehículo NO existe todavía en la flota: recién
  // se crea, DISPONIBLE y a nombre del cliente, cuando ambas validaciones dan
  // RESULTADO_VALIDACION_VALIDADO.
  // Datos requeridos: cliente_id, patente, marca, modelo, anio (4 dígitos),
  // tipo_vehiculo y precio_diario (mayor a 0). Opcional: color.
  // Responde la solicitud creada, con sus validaciones todavía pendientes.
  // Errores: INVALID_ARGUMENT (campos obligatorios faltantes o inválidos),
  // ALREADY_EXISTS (la patente ya es un vehículo o tiene una solicitud en
  // curso), NOT_FOUND (el cliente no existe).
  rpc IncorporarVehiculoExterno(SolicitudIncorporarVehiculoExterno)
      returns (RespuestaIncorporarVehiculoExterno);

  // Lista las solicitudes de incorporación de vehículos externos,
  // opcionalmente de un solo cliente, para seguir el avance de cada una.
  // Sin resultados responde una lista vacía.
  // Errores: INVALID_ARGUMENT (cliente_id menor o igual a cero).
  rpc ConsultarSolicitudesIncorporacion(SolicitudConsultarSolicitudesIncorporacion)
      returns (RespuestaConsultarSolicitudesIncorporacion);
}

// Representación completa de un vehículo, tal como se devuelve al cliente.
message Vehiculo {
  // Identificador del vehículo, asignado por el servicio al crearlo.
  int64 id = 1;

  // Patente. Única en el sistema e inmodificable.
  string patente = 2;
  string marca = 3;
  string modelo = 4;

  // Año de fabricación, como texto numérico de 4 dígitos (ej: "2022").
  string anio = 5;

  optional string color = 6;
  rentar.comun.v1.TipoVehiculo tipo_vehiculo = 7;

  // Precio de alquiler por día. Mayor a 0.
  double precio_diario = 8;

  // Estado operativo actual (disponible, reservado o en alquiler).
  rentar.comun.v1.EstadoVehiculo estado = 9;

  // false si el vehículo fue dado de baja (baja lógica).
  bool activo = 10;

  // Resultado de la verificación de la patente contra el registro policial
  // (asíncrona). Un vehículo nuevo arranca en ESTADO_VERIFICACION_PENDIENTE.
  // ROBADO no es un estado operativo: "estado" sigue siendo disponible,
  // reservado o en alquiler. Un vehículo ROBADO queda inhabilitado: no aparece
  // como disponible y no se puede reservar.
  EstadoVerificacion verificacion = 11;

  // Cliente dueño del vehículo si entró por incorporación externa. Ausente
  // para los vehículos de la flota de Rentar.
  optional int64 propietario_cliente_id = 12;
}

// Resultado de la verificación de un vehículo contra el registro policial.
enum EstadoVerificacion {
  // No informado. No es un valor válido para guardar.
  ESTADO_VERIFICACION_NO_ESPECIFICADO = 0;
  // Todavía no llegó el resultado del registro policial.
  ESTADO_VERIFICACION_PENDIENTE = 1;
  // La patente no figura como robada.
  ESTADO_VERIFICACION_VALIDADO = 2;
  // La patente figura como robada: el vehículo queda inhabilitado.
  ESTADO_VERIFICACION_ROBADO = 3;
}

// Datos para dar de alta un vehículo. patente, marca, modelo, anio,
// tipo_vehiculo y precio_diario son obligatorios; color es opcional.
message SolicitudCrearVehiculo {
  // Patente. Obligatoria y única.
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  // Año de fabricación, texto numérico entre 1900 y el año actual.
  string anio = 4;
  optional string color = 5;
  // Obligatorio: no puede ser TIPO_VEHICULO_NO_ESPECIFICADO.
  rentar.comun.v1.TipoVehiculo tipo_vehiculo = 6;
  // Mayor a 0.
  double precio_diario = 7;
}

// Vehículo creado.
message RespuestaCrearVehiculo {
  Vehiculo vehiculo = 1;
}

// Datos para modificar un vehículo existente. No incluye patente: no es
// modificable.
message SolicitudActualizarVehiculo {
  // Id del vehículo a modificar.
  int64 id = 1;
  string marca = 2;
  string modelo = 3;
  string anio = 4;
  optional string color = 5;
  rentar.comun.v1.TipoVehiculo tipo_vehiculo = 6;
  double precio_diario = 7;
}

// Vehículo con los datos ya actualizados.
message RespuestaActualizarVehiculo {
  Vehiculo vehiculo = 1;
}

// Vehículo a dar de baja.
message SolicitudDarDeBajaVehiculo {
  // Id del vehículo.
  int64 id = 1;
}

// Vehículo ya dado de baja (activo = false).
message RespuestaDarDeBajaVehiculo {
  Vehiculo vehiculo = 1;
}

// Vehículo a reactivar.
message SolicitudReactivarVehiculo {
  // Id del vehículo.
  int64 id = 1;
}

// Vehículo ya reactivado (activo = true).
message RespuestaReactivarVehiculo {
  Vehiculo vehiculo = 1;
}

// Filtros opcionales para listar vehículos. Sin filtros, trae todos.
message SolicitudConsultarVehiculos {
  // true: solo activos; false: solo dados de baja; ausente: ambos.
  optional bool activo = 1;

  // Filtra por tipo. Ausente o TIPO_VEHICULO_NO_ESPECIFICADO: todos los tipos.
  optional rentar.comun.v1.TipoVehiculo tipo_vehiculo = 2;

  // Si no está vacía, devuelve solo los vehículos con esos ids. Vacía: sin
  // filtro por id.
  repeated int64 ids = 3;
}

// Vehículos que cumplen los filtros. Lista vacía si no hay ninguno.
message RespuestaConsultarVehiculos {
  repeated Vehiculo vehiculos = 1;
}

// Vehículo a consultar.
message SolicitudConsultarVehiculo {
  // Id del vehículo.
  int64 id = 1;
}

// Vehículo pedido.
message RespuestaConsultarVehiculo {
  Vehiculo vehiculo = 1;
}

// Todos los campos son opcionales. marca y modelo hacen búsqueda parcial
// (contiene, sin distinguir mayúsculas). vehiculos_ocupados_ids es la lista
// de ids a excluir del resultado, calculada por el Rental Service para el
// período consultado.
message SolicitudConsultarDisponibilidad {
  optional rentar.comun.v1.TipoVehiculo tipo_vehiculo = 1;
  optional string marca = 2;
  optional string modelo = 3;
  // Precio diario mínimo (inclusive).
  optional double precio_min = 4;
  // Precio diario máximo (inclusive). No puede ser menor que precio_min.
  optional double precio_max = 5;

  // Ids de vehículos ocupados en el período, que se excluyen del resultado.
  repeated int64 vehiculos_ocupados_ids = 6;
}

// Vehículos activos que cumplen los filtros y no están ocupados.
message RespuestaConsultarDisponibilidad {

  repeated Vehiculo vehiculos = 1;
}

// Cambio de estado operativo de un vehículo.
message SolicitudActualizarEstadoVehiculo {
  // Id del vehículo.
  int64 vehiculo_id = 1;
  // Estado nuevo. No puede ser ESTADO_VEHICULO_NO_ESPECIFICADO.
  rentar.comun.v1.EstadoVehiculo estado = 2;
}

// Vehículo con el estado ya cambiado.
message RespuestaActualizarEstadoVehiculo {
  Vehiculo vehiculo = 1;
}

// ---------------------------------------------------------------------------
// Incorporación de vehículos externos
// ---------------------------------------------------------------------------

// Estado de una solicitud de incorporación de un vehículo externo.
enum EstadoSolicitudIncorporacion {
  // No informado. No es un valor válido para guardar.
  ESTADO_SOLICITUD_INCORPORACION_NO_ESPECIFICADO = 0;
  // Esperando el resultado de las validaciones de patente y titularidad.
  ESTADO_SOLICITUD_INCORPORACION_PENDIENTE = 1;
  // Alguna de las validaciones fue rechazada: el vehículo no se incorpora.
  ESTADO_SOLICITUD_INCORPORACION_RECHAZADA = 2;
  // Ambas validaciones dieron VALIDADO y el vehículo ya fue creado.
  ESTADO_SOLICITUD_INCORPORACION_INCORPORADA = 3;
}

// Resultado de una de las validaciones de una solicitud de incorporación
// (patente o titularidad).
enum ResultadoValidacion {
  // No informado. No es un valor válido para guardar.
  RESULTADO_VALIDACION_NO_ESPECIFICADO = 0;
  // Todavía no llegó el resultado.
  RESULTADO_VALIDACION_PENDIENTE = 1;
  // La validación fue aprobada.
  RESULTADO_VALIDACION_VALIDADO = 2;
  // La validación fue rechazada.
  RESULTADO_VALIDACION_RECHAZADO = 3;
}

// Solicitud de incorporación de un vehículo externo y su avance. Es lo que
// consulta el cliente para saber en qué quedó su pedido.
message IncorporacionExterna {
  // Identificador de la solicitud. Es el vehiculoExternoId de los eventos.
  int64 id = 1;

  // Cliente que propone el vehículo.
  int64 cliente_id = 2;

  // Datos del vehículo propuesto. Se guardan en la solicitud porque el evento
  // vehiculos.externos.registrados solo lleva vehiculoExternoId, clienteId y
  // patente, y para crear el vehículo hacen falta todos.
  string patente = 3;
  string marca = 4;
  string modelo = 5;
  string anio = 6;
  optional string color = 7;
  rentar.comun.v1.TipoVehiculo tipo_vehiculo = 8;
  double precio_diario = 9;

  // Estado general de la solicitud.
  EstadoSolicitudIncorporacion estado = 10;

  // Resultado de la validación de la patente (registro policial).
  ResultadoValidacion validacion_patente = 11;

  // Resultado de la validación de titularidad.
  ResultadoValidacion validacion_titularidad = 12;

  // Id del vehículo creado. Solo presente cuando la solicitud quedó
  // INCORPORADA.
  optional int64 vehiculo_id = 13;
}

// Datos del vehículo que el cliente quiere incorporar. Todos son obligatorios
// salvo color.
message SolicitudIncorporarVehiculoExterno {
  // Cliente dueño del vehículo. Mayor que cero.
  int64 cliente_id = 1;
  // Patente. No puede estar ya registrada ni tener otra solicitud en curso.
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  // Año de fabricación, texto numérico de 4 dígitos.
  string anio = 5;
  optional string color = 6;
  rentar.comun.v1.TipoVehiculo tipo_vehiculo = 7;
  // Precio de alquiler por día. Mayor a 0.
  double precio_diario = 8;
}

// Solicitud creada, en estado pendiente y con las validaciones sin resultado.
message RespuestaIncorporarVehiculoExterno {
  IncorporacionExterna solicitud = 1;
}

// Filtro opcional para listar solicitudes de incorporación.
message SolicitudConsultarSolicitudesIncorporacion {
  // Solo las solicitudes de este cliente. Ausente: las de todos los clientes.
  optional int64 cliente_id = 1;
}

// Solicitudes que cumplen el filtro. Lista vacía si no hay ninguna.
message RespuestaConsultarSolicitudesIncorporacion {
  repeated IncorporacionExterna solicitudes = 1;
}
