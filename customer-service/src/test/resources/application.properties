spring.application.name=customer-service

# En los tests el servidor gRPC corre en memoria (in-process), sin abrir un puerto.
spring.grpc.server.port=0
spring.grpc.server.inprocess.name=customer-service-test

# H2 en modo PostgreSQL con el mismo script que la base real, para que los tests
# verifiquen que las entidades coinciden con database/01_clientes.sql.
spring.datasource.url=jdbc:h2:mem:clientes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/01_clientes.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
