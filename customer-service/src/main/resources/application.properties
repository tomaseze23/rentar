spring.application.name=customer-service

# Servidor gRPC (Customer Service). El API Gateway se conecta a este puerto (CLIENTE_ADDR=localhost:9092).
spring.grpc.server.port=${GRPC_PORT:9092}
# Reflection: permite listar y probar los métodos con grpcurl / Postman sin el .proto
spring.grpc.server.reflection.enabled=true

# Base de datos propia del servicio (no la comparte con ningún otro componente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentar_clientes?sslmode=disable}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crea database/01_clientes.sql; Hibernate sólo verifica que coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
