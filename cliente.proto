syntax = "proto3";

package rentar.cliente.v1;

import "comun.proto";

service ServicioClientes {
  rpc CrearCliente(SolicitudCrearCliente) returns (Cliente);
  rpc ActualizarCliente(SolicitudActualizarCliente) returns (Cliente);
  rpc DarDeBajaCliente(SolicitudIdCliente) returns (rentar.comun.v1.ResultadoOperacion);
  rpc ReactivarCliente(SolicitudIdCliente) returns (Cliente);

  rpc ConsultarClientes(SolicitudConsultarClientes) returns (RespuestaConsultarClientes);
  rpc ConsultarCliente(SolicitudIdCliente) returns (Cliente);
  rpc VerificarExistenciaCliente(SolicitudIdCliente) returns (RespuestaVerificarExistenciaCliente);
  rpc VerificarClienteActivo(SolicitudIdCliente) returns (RespuestaVerificarClienteActivo);
}

message Cliente {
  int64 id = 1;
  int64 usuario_id = 2;
  string email = 3;
  string documento = 4;
  string nombre = 5;
  string apellido = 6;
  optional string telefono = 7;

  optional string fecha_nacimiento = 8;
  bool activo = 9;
}

message SolicitudCrearCliente {
  string email = 1;
  string password = 2;
  string documento = 3;
  string nombre = 4;
  string apellido = 5;
  optional string telefono = 6;

  optional string fecha_nacimiento = 7;
}

message SolicitudActualizarCliente {
  int64 id = 1;
  string nombre = 2;
  string apellido = 3;
  optional string telefono = 4;
  optional string fecha_nacimiento = 5;
}

message SolicitudIdCliente {
  int64 id = 1;
}

message SolicitudConsultarClientes {
  bool incluir_inactivos = 1;
}

message RespuestaConsultarClientes {
  repeated Cliente clientes = 1;
}

message RespuestaVerificarExistenciaCliente {
  bool existe = 1;
}

message RespuestaVerificarClienteActivo {
  bool existe = 1;
  bool activo = 2;
}
